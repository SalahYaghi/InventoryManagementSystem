name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore InventoryManagementSystemAPI.slnx

      - name: Build solution
        run: dotnet build InventoryManagementSystemAPI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test InventoryManagementSystemAPI.slnx --configuration Release --no-build --verbosity normal